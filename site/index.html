<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NACA Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f3f6f6;        /* chart paper */
  --panel: #ffffff;
  --grid: #c9d6d8;         /* grid lines, borders */
  --grid-fine: #e2eaeb;
  --ink: #17242f;
  --ink-2: #4d5d68;
  --trace: #c8102e;        /* digitized curves: the one accent */
  --ok: #2f7d4f;
  --warn: #9a5b00;
  --focus: #1f5fbf;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121a20; --panel: #18222a; --grid: #2f3e48; --grid-fine: #22303a;
    --ink: #e6edf0; --ink-2: #9fb0ba; --trace: #ff5a6e; --ok: #6cc38f; --warn: #e0a64a; --focus: #7fb0ff;
  }
}
:root[data-theme="dark"] {
  --paper: #121a20; --panel: #18222a; --grid: #2f3e48; --grid-fine: #22303a;
  --ink: #e6edf0; --ink-2: #9fb0ba; --trace: #ff5a6e; --ok: #6cc38f; --warn: #e0a64a; --focus: #7fb0ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.5 "Public Sans", system-ui, sans-serif;
  display: grid; grid-template-rows: auto 1fr;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
header {
  display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--grid); background: var(--panel);
}
header h1 { font: 600 19px/1.2 "Source Serif 4", Georgia, serif; margin: 0; }
#counts { color: var(--ink-2); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; min-height: 0; }
#side { border-right: 1px solid var(--grid); display: flex; flex-direction: column; min-height: 0; }
#searchbox { padding: 16px 16px 10px; display: grid; gap: 10px; }
#q {
  width: 100%; padding: 9px 11px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--panel); border: 1px solid var(--grid); border-radius: 4px;
}
.kinds { display: flex; flex-wrap: wrap; gap: 6px; }
.kinds button {
  font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 3px; cursor: pointer;
  border: 1px solid var(--grid); background: transparent; color: var(--ink-2);
}
.kinds button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
#results { list-style: none; margin: 0; padding: 0 0 24px; overflow-y: auto; }
#results li button {
  display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: none; border: 0; border-top: 1px solid var(--grid-fine); padding: 10px 16px;
}
#results li button:hover, #results li button[aria-current="true"] { background: var(--panel); }
.r-head { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--ink-2); }
.r-title { font-weight: 500; margin: 2px 0; }
.r-snip { font-size: 13px; color: var(--ink-2); }
.r-snip b, .hl { color: var(--ink); background: color-mix(in srgb, var(--trace) 16%, transparent); font-weight: 500; }
.tag { font-size: 12px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--grid); }
.tag.review { color: var(--warn); border-color: currentColor; }
.tag.auto, .tag.accepted { color: var(--ok); border-color: currentColor; }
#detail { overflow-y: auto; padding: 24px 32px 48px; min-width: 0; }
#detail h2 { font: 600 24px/1.25 "Source Serif 4", Georgia, serif; margin: 0 0 6px; max-width: 46ch; }
#detail h3 { font-size: 16px; font-weight: 600; margin: 28px 0 8px; }
.meta { color: var(--ink-2); font-size: 14px; }
.prose { max-width: 70ch; }
a { color: var(--focus); }
.figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.figs button {
  font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 0;
  background: var(--panel); border: 1px solid var(--grid); border-radius: 4px; overflow: hidden;
}
.figs img { display: block; width: 100%; height: 150px; object-fit: contain; background: #fff; }
.figs .cap { padding: 8px 10px; font-size: 13px; }
.plot-wrap { background: var(--panel); border: 1px solid var(--grid); border-radius: 4px; padding: 12px; max-width: 900px; }
.plot svg { width: 100%; height: auto; display: block; }
.plot .gl { stroke: var(--grid-fine); }
.plot .gm { stroke: var(--grid); }
.plot .tick { fill: var(--ink-2); font-size: 11px; }
.plot path { fill: none; stroke: var(--trace); stroke-width: 2; }
.plot path.dim { stroke-opacity: .25; }
.plot .lab { fill: var(--trace); font-size: 12px; font-weight: 600; }
.scan { max-width: 900px; margin-top: 12px; }
.scan img { width: 100%; border: 1px solid var(--grid); background: #fff; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.btn {
  font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 3px; cursor: pointer;
  border: 1px solid var(--grid); background: var(--panel); color: var(--ink);
}
.reasons { color: var(--warn); font-size: 14px; margin: 6px 0; padding-left: 18px; }
table.data { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.data td, table.data th { border-bottom: 1px solid var(--grid-fine); padding: 4px 12px 4px 0; text-align: left; vertical-align: top; }
textarea { width: 100%; max-width: 900px; min-height: 120px; font: 13px/1.4 ui-monospace, monospace; color: var(--ink); background: var(--panel); border: 1px solid var(--grid); border-radius: 4px; padding: 8px; }
.empty { color: var(--ink-2); max-width: 52ch; }
label.inline { font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
input.small { width: 90px; font: inherit; font-size: 13px; padding: 3px 6px; color: var(--ink); background: var(--panel); border: 1px solid var(--grid); border-radius: 3px; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  #side { border-right: 0; border-bottom: 1px solid var(--grid); max-height: 48vh; }
  #detail { padding: 18px 16px 40px; }
}
@media (prefers-reduced-motion: no-preference) {
  .plot path { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .9s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
}
</style>
</head>
<body>
<header>
  <h1>NACA Archive</h1>
  <span id="counts">Loading the database…</span>
</header>
<main>
  <section id="side" aria-label="Search">
    <div id="searchbox">
      <input id="q" type="search" placeholder="Search reports, figures, tables" aria-label="Search" autocomplete="off">
      <div class="kinds" role="group" aria-label="Show">
        <button data-k="" aria-pressed="true">Everything</button>
        <button data-k="report" aria-pressed="false">Reports</button>
        <button data-k="figure" aria-pressed="false">Figures</button>
        <button data-k="table" aria-pressed="false">Tables</button>
        <button data-k="page" aria-pressed="false">Pages</button>
        <button data-k="review" aria-pressed="false">Needs review</button>
      </div>
    </div>
    <ul id="results"></ul>
  </section>
  <section id="detail" aria-live="polite">
    <p class="empty">Search for a propeller, an airfoil section or a test, like <em>dual rotating power coefficient</em>. Digitized curves open as data you can plot and download; figures marked <em>needs review</em> are ones the automatic reading wasn't sure of.</p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
<script>
"use strict";
let db, kind = "", current = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function rows(sql, params = []) {
  const st = db.prepare(sql); st.bind(params);
  const out = []; while (st.step()) out.push(st.getAsObject()); st.free(); return out;
}
// same normalization as nacaarchive.db.fts_text
function ftsText(s) {
  return s.replace(/°/g, " deg ").normalize("NFKD").replace(/[̀-ͯ]/g, "")
          .replace(/[^\x00-\x7f]/g, " ");
}
function matchQuery(q) {
  const toks = ftsText(q).toLowerCase().match(/[a-z0-9]+/g) || [];
  return toks.map((t, i) => i === toks.length - 1 && t.length > 2 ? t + "*" : t).join(" ");
}
function rank(blob) {   // matches nacaarchive.db.rank
  const v = new Uint32Array(blob.buffer, blob.byteOffset, blob.length / 4);
  const p = v[0], c = v[1]; let s = 0;
  for (let i = 0; i < p; i++) for (let j = 0; j < c; j++) {
    const k = 2 + 3 * (i * c + j); if (v[k]) s += (j === 3 ? 2 : 1) * v[k] / v[k + 1];
  }
  return s;
}

async function init() {
  const SQL = await initSqlJs({ locateFile: f => `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${f}` });
  let buf;
  try { buf = await (await fetch("naca.db")).arrayBuffer(); }
  catch (e) { $("#counts").textContent = "The database (naca.db) couldn't be loaded. Open this page from the published site, not from a file."; return; }
  db = new SQL.Database(new Uint8Array(buf));
  db.create_function("rank", rank);
  const c = JSON.parse(rows("SELECT value FROM meta WHERE key='counts'")[0].value);
  const rev = rows("SELECT count(*) n FROM figures WHERE status='needs_review'")[0].n;
  const pl = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  $("#counts").textContent = `${pl(c.reports, "report")}, ${pl(c.figures, "figure")}, ${pl(c.curves, "digitized curve")}, ${pl(c.tables, "table")}. ${rev ? pl(rev, "figure") + " to review." : "Nothing to review."}`;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("q")) $("#q").value = h.get("q");
  search();
  if (h.get("fig")) showFigure(+h.get("fig")); else if (h.get("report")) showReport(h.get("report"));
}

function search() {
  const q = $("#q").value.trim();
  const list = $("#results"); list.innerHTML = "";
  let res;
  if (kind === "review") {
    res = rows(`SELECT 'figure' kind, f.id ref, f.report_id, 'Figure ' || coalesce(f.label,'?') title, f.reasons snip, r.number, r.year, f.status
                FROM figures f JOIN reports r ON r.id=f.report_id WHERE f.status='needs_review' ORDER BY r.year, r.number LIMIT 300`);
  } else if (!q) {
    res = rows(`SELECT 'report' kind, id ref, id report_id, title, '' snip, number, year FROM reports
                ${kind && kind !== "report" ? "WHERE 0" : ""} ORDER BY year, number LIMIT 300`);
  } else {
    const m = matchQuery(q);
    if (!m) return;
    res = rows(`SELECT s.kind, s.ref, s.report_id, s.title, snippet(search, '<b>', '</b>', '…', 4, 14) snip,
                       r.number, r.year, f.status
                FROM search s JOIN reports r ON r.id=s.report_id
                LEFT JOIN figures f ON s.kind='figure' AND f.id=s.ref
                WHERE search MATCH ? ${kind ? "AND s.kind=?" : ""}
                ORDER BY rank(matchinfo(search, 'pcx')) DESC LIMIT 200`, kind ? [m, kind] : [m]);
  }
  if (!res.length) { list.innerHTML = `<li class="empty" style="padding:12px 16px">Nothing found. Try fewer or broader words.</li>`; return; }
  for (const r of res) {
    const li = document.createElement("li");
    const status = r.status ? `<span class="tag ${r.status === "needs_review" ? "review" : r.status}">${r.status.replace("_", " ")}</span>` : "";
    const where = r.kind === "page" ? `page ${r.ref}` : r.kind;
    let snip = r.snip || "";
    if (kind === "review") snip = esc(JSON.parse(snip || "[]").join("; ")); // reasons, plain text
    li.innerHTML = `<button><div class="r-head"><span>${esc(r.number || r.report_id)}</span><span>${r.year || ""}</span><span>${where}</span>${status}</div>
      <div class="r-title">${esc(r.kind === "report" || r.kind === "page" ? r.title : r.title)}</div><div class="r-snip">${snip}</div></button>`;
    li.querySelector("button").onclick = e => {
      list.querySelectorAll('[aria-current]').forEach(b => b.removeAttribute("aria-current"));
      e.currentTarget.setAttribute("aria-current", "true");
      if (r.kind === "figure") showFigure(r.ref);
      else if (r.kind === "table") showTable(r.ref);
      else showReport(r.report_id, r.kind === "page" ? r.ref : null);
    };
    list.appendChild(li);
  }
}

function setHash(o) {
  const p = new URLSearchParams(); const q = $("#q").value.trim(); if (q) p.set("q", q);
  for (const [k, v] of Object.entries(o)) p.set(k, v);
  history.replaceState(null, "", "#" + p);
}

function reportHeader(r) {
  return `<h2>${esc(r.title)}</h2>
    <p class="meta">${esc(r.number || "")} ${r.year ? "(" + r.year + ")" : ""}${r.authors ? ", " + esc(r.authors) : ""}.
    <a href="${esc(r.url)}" target="_blank" rel="noopener">Original on NTRS</a></p>`;
}

function showReport(id, page) {
  const r = rows("SELECT * FROM reports WHERE id=?", [id])[0]; if (!r) return;
  const figs = rows("SELECT id, label, caption, status, image, kind FROM figures WHERE report_id=? ORDER BY page, key", [id]);
  const tabs = rows("SELECT id, label, caption FROM tables WHERE report_id=? ORDER BY page", [id]);
  let html = reportHeader(r) + (r.abstract ? `<p class="prose">${esc(r.abstract)}</p>` : "");
  if (figs.length) {
    html += `<h3>Figures</h3><div class="figs">` + figs.map(f => `<button data-f="${f.id}">
      <img src="reports/${esc(f.image)}" alt="" loading="lazy">
      <div class="cap"><strong>Figure ${esc(f.label || "?")}</strong> <span class="tag ${f.status === "needs_review" ? "review" : f.status}">${f.status.replace("_", " ")}</span><br>${esc((f.caption || "").slice(0, 110))}</div></button>`).join("") + `</div>`;
  }
  if (tabs.length) html += `<h3>Tables</h3><ul>` + tabs.map(t => `<li><a href="#" data-t="${t.id}">Table ${esc(t.label)}</a> ${esc(t.caption.slice(0, 100))}</li>`).join("") + `</ul>`;
  const pages = rows("SELECT page, text, source FROM pages WHERE report_id=? ORDER BY page", [id]);
  if (pages.length) {
    html += `<h3>Text</h3>` + pages.map(p => `<details ${p.page === page ? "open" : ""}><summary>Page ${p.page} <span class="meta">(${p.source === "ocr" ? "OCR" : "text layer"})</span></summary><p class="prose" style="white-space:pre-wrap">${highlight(esc(p.text))}</p></details>`).join("");
  }
  $("#detail").innerHTML = html;
  $("#detail").querySelectorAll("[data-f]").forEach(b => b.onclick = () => showFigure(+b.dataset.f));
  $("#detail").querySelectorAll("[data-t]").forEach(a => a.onclick = e => { e.preventDefault(); showTable(+a.dataset.t); });
  $("#detail").scrollTop = 0;
  setHash({ report: id });
}

function highlight(html) {
  const toks = (ftsText($("#q").value).toLowerCase().match(/[a-z0-9]{3,}/g) || []);
  if (!toks.length) return html;
  return html.replace(new RegExp(`\\b(${toks.join("|")})\\w*`, "gi"), '<span class="hl">$&</span>');
}

function showFigure(id) {
  const f = rows("SELECT f.*, r.title, r.number, r.year, r.authors, r.url, r.id rid FROM figures f JOIN reports r ON r.id=f.report_id WHERE f.id=?", [id])[0];
  if (!f) return;
  const curves = rows("SELECT idx, label, x, y FROM curves WHERE figure_id=? ORDER BY idx", [id]).map(c => ({ ...c, x: JSON.parse(c.x), y: JSON.parse(c.y) }));
  const reasons = JSON.parse(f.reasons || "[]");
  let html = `<p class="meta"><a href="#" id="back">${esc(f.number || f.rid)}</a>, page ${f.page}</p>
    <h2>Figure ${esc(f.label || "?")}</h2><p class="prose">${esc(f.caption || "No caption found.")}</p>
    <p><span class="tag ${f.status === "needs_review" ? "review" : f.status}">${f.status.replace("_", " ")}</span></p>`;
  if (reasons.length) html += `<ul class="reasons">${reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`;
  if (curves.length) {
    html += `<div class="plot-wrap"><div class="plot">${plot(curves)}</div>
      <div class="toolbar"><button class="btn" id="csv">Download curves (CSV)</button></div></div>`;
  }
  html += `<div class="toolbar"><button class="btn" id="scanbtn">${f.check_image ? "Show the reading drawn on the scan" : "Show the scan"}</button></div>
    <div class="scan" id="scan" hidden><img alt="Scanned figure" src="reports/${esc(f.check_image || f.image)}"></div>`;
  if (f.kind === "chart") html += reviewForm(f, curves);
  $("#detail").innerHTML = html;
  $("#back").onclick = e => { e.preventDefault(); showReport(f.rid); };
  $("#scanbtn").onclick = () => { const s = $("#scan"); s.hidden = !s.hidden; };
  if ($("#csv")) $("#csv").onclick = () => download(`${f.number || f.rid}_fig${f.label || f.key}.csv`, toCSV(curves));
  bindReview(f);
  $("#detail").scrollTop = 0;
  setHash({ fig: id });
}

function niceTicks(lo, hi, n = 8) {
  const span = hi - lo || 1, raw = span / n, e = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * e).find(s => s >= raw);
  const a = Math.floor(lo / step + 1e-9), b = Math.ceil(hi / step - 1e-9);
  const t = []; for (let k = a; k <= b; k++) t.push(+(k * step).toFixed(10));
  return t;
}
function plot(curves) {
  const W = 760, H = 440, L = 56, R = 16, T = 14, B = 34;
  const xs = curves.flatMap(c => c.x), ys = curves.flatMap(c => c.y);
  const xt = niceTicks(Math.min(...xs), Math.max(...xs)), yt = niceTicks(Math.min(0, ...ys), Math.max(...ys));
  const x0 = xt[0], x1 = xt.at(-1), y0 = yt[0], y1 = yt.at(-1);
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => H - B - (v - y0) / (y1 - y0) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Digitized curves">`;
  const fine = (t, k) => { const out = []; for (let i = 0; i < t.length - 1; i++) for (let j = 1; j < 5; j++) out.push(t[i] + (t[i + 1] - t[i]) * j / 5); return out; };
  for (const v of fine(xt)) s += `<line class="gl" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}"/>`;
  for (const v of fine(yt)) s += `<line class="gl" y1="${Y(v)}" y2="${Y(v)}" x1="${L}" x2="${W - R}"/>`;
  for (const v of xt) s += `<line class="gm" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H - B}"/><text class="tick" x="${X(v)}" y="${H - B + 16}" text-anchor="middle">${v}</text>`;
  for (const v of yt) s += `<line class="gm" y1="${Y(v)}" y2="${Y(v)}" x1="${L}" x2="${W - R}"/><text class="tick" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  curves.forEach((c, i) => {
    const d = c.x.map((v, k) => `${k ? "L" : "M"}${X(v).toFixed(1)},${Y(c.y[k]).toFixed(1)}`).join("");
    s += `<path d="${d}" style="--len:3000" data-i="${i}"><title>${esc(c.label || "curve " + i)}</title></path>`;
    const k = Math.floor(c.x.length * 0.1);
    s += `<text class="lab" x="${X(c.x[k]) + 4}" y="${Y(c.y[k]) - 6}">${esc(c.label || "#" + i)}</text>`;
  });
  return s + `</svg>`;
}
function toCSV(curves) {
  let out = "curve,label,x,y\n";
  curves.forEach(c => c.x.forEach((x, k) => out += `${c.idx},"${(c.label || "").replace(/"/g, '""')}",${x},${c.y[k]}\n`));
  return out;
}
function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function reviewForm(f, curves) {
  return `<h3>Correct this reading</h3>
  <p class="prose meta">Saved corrections go in the repository as <code>reviews/${esc(f.rid)}/${esc(f.key)}.json</code> and are applied every time the report is processed.</p>
  <div class="toolbar">
    <label class="inline">Status <select id="rv-status" class="small"><option value="">unchanged</option><option>accepted</option><option>rejected</option></select></label>
    <label class="inline">x at first line <input id="rv-x0" class="small" inputmode="decimal"></label>
    <label class="inline">x step <input id="rv-xs" class="small" inputmode="decimal"></label>
    <label class="inline">y at first line <input id="rv-y0" class="small" inputmode="decimal"></label>
    <label class="inline">y step <input id="rv-ys" class="small" inputmode="decimal"></label>
  </div>
  <div class="toolbar">${curves.map(c => `<label class="inline">#${c.idx} <input class="small rv-lab" data-i="${c.idx}" value="${esc(c.label || "")}"></label>
     <label class="inline"><input type="checkbox" class="rv-drop" data-i="${c.idx}">drop</label>`).join("")}</div>
  <p class="meta">The first grid lines are the leftmost and the topmost; y steps are negative when values fall going down.</p>
  <textarea id="rv-out" readonly aria-label="Correction file"></textarea>
  <div class="toolbar"><button class="btn" id="rv-copy">Copy correction</button></div>`;
}
function bindReview(f) {
  const out = $("#rv-out"); if (!out) return;
  const upd = () => {
    const o = {}; const st = $("#rv-status").value; if (st) o.status = st;
    const n = id => $(id).value.trim() === "" ? null : +$(id).value;
    if (n("#rv-x0") !== null && n("#rv-xs") !== null) o.x = [n("#rv-x0"), n("#rv-xs")];
    if (n("#rv-y0") !== null && n("#rv-ys") !== null) o.y = [n("#rv-y0"), n("#rv-ys")];
    const labels = {}; document.querySelectorAll(".rv-lab").forEach(i => { if (i.value !== i.defaultValue) labels[i.dataset.i] = i.value; });
    if (Object.keys(labels).length) o.labels = labels;
    const drop = [...document.querySelectorAll(".rv-drop:checked")].map(i => +i.dataset.i);
    if (drop.length) o.drop = drop;
    document.querySelectorAll(".plot path").forEach(p => p.classList.toggle("dim", drop.includes(+p.dataset.i)));
    out.value = JSON.stringify(o, null, 1);
  };
  $("#detail").querySelectorAll("input, select").forEach(e => e.addEventListener("input", upd));
  $("#rv-copy").onclick = async () => { await navigator.clipboard.writeText(out.value); $("#rv-copy").textContent = "Copied"; };
  upd();
}

function showTable(id) {
  const t = rows("SELECT t.*, r.number, r.id rid FROM tables t JOIN reports r ON r.id=t.report_id WHERE t.id=?", [id])[0]; if (!t) return;
  const data = JSON.parse(t.rows);
  $("#detail").innerHTML = `<p class="meta"><a href="#" id="back">${esc(t.number || t.rid)}</a>, page ${t.page}</p>
    <h2>Table ${esc(t.label)}</h2><p class="prose">${esc(t.caption)}</p>
    <p><span class="tag ${t.status === "needs_review" ? "review" : t.status}">${t.status.replace("_", " ")}</span></p>
    <table class="data">${data.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table>
    <div class="toolbar"><button class="btn" id="csv">Download table (CSV)</button></div>`;
  $("#back").onclick = e => { e.preventDefault(); showReport(t.rid); };
  $("#csv").onclick = () => download(`${t.number || t.rid}_table${t.label}.csv`, data.map(r => r.map(c => `"${c.replace(/"/g, '""')}"`).join(",")).join("\n"));
  setHash({ table: id });
}

let timer;
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 180); });
document.querySelectorAll(".kinds button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".kinds button").forEach(x => x.setAttribute("aria-pressed", x === b));
  kind = b.dataset.k; search();
});
init();
</script>
